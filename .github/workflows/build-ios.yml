name: Build Harmony Monitor for iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          preferred_xcode=/Applications/Xcode_26.6.app/Contents/Developer
          if [[ -d "$preferred_xcode" ]]; then
            sudo xcode-select --switch "$preferred_xcode"
          fi
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path

      - name: Find an iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess

          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          devices = json.loads(raw)["devices"]
          candidates = []
          for runtime, items in devices.items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              version = tuple(map(int, re.findall(r"\d+", runtime)))
              if not version or version[0] < 17:
                  continue
              for device in items:
                  if device.get("isAvailable") and device["name"].startswith("iPhone "):
                      priority = (device["name"] == "iPhone 17 Pro", version)
                      candidates.append((priority, device["udid"]))
          if not candidates:
              raise SystemExit("No iPhone simulator found. Check the macos-26 runner's Xcode and iOS runtime.")
          print(f"udid={max(candidates)[1]}")
          PY

      - name: Run XCTest on iPhone Simulator
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project HarmonyMonitor.xcodeproj \
            -scheme HarmonyMonitor \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 90 \
            -derivedDataPath build/simulator \
            -parallel-testing-enabled NO

      - name: Build device app without provisioning
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HarmonyMonitor.xcodeproj \
            -scheme HarmonyMonitor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app=build/device/Build/Products/Release-iphoneos/HarmonyMonitor.app
          test -f "$app/Info.plist"
          test ! -e "$app/embedded.mobileprovision"
          xcrun lipo "$app/HarmonyMonitor" -verify_arch arm64
          mkdir -p build/staging/Payload build/artifacts
          ditto "$app" build/staging/Payload/HarmonyMonitor.app
          (
            cd build/staging
            /usr/bin/zip -qry ../artifacts/HarmonyMonitor-unsigned.ipa Payload
          )
          /usr/bin/unzip -tq build/artifacts/HarmonyMonitor-unsigned.ipa

      - name: Upload unsigned iPhone build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HarmonyMonitor-iOS-unsigned
          path: build/artifacts/HarmonyMonitor-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
